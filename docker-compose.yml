x-shared-budget-environment: &shared-budget-environment
  COLLECTOR_REQUIRE_SHARED_BUDGET: "true"
  COLLECTOR_SHARED_BUDGET_DSN: ${REVIEWED_COLLECTOR_DSN:-}
  COLLECTOR_COUPANG_BUDGET_ACCOUNT: ${COLLECTOR_COUPANG_BUDGET_ACCOUNT:-}
  COLLECTOR_NAVER_BUDGET_ACCOUNT: ${COLLECTOR_NAVER_BUDGET_ACCOUNT:-}
  COLLECTOR_OWNERCLAN_BUDGET_ACCOUNT: ${COLLECTOR_OWNERCLAN_BUDGET_ACCOUNT:-}
  COLLECTOR_DOMEGGOOK_BUDGET_ACCOUNT: ${COLLECTOR_DOMEGGOOK_BUDGET_ACCOUNT:-}

services:
  postgres:
    image: postgres:16
    container_name: product-data-collector-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  data-collector:
    profiles: [collectors]
    image: python:3.12-slim
    container_name: product-data-collector-app
    working_dir: /app
    env_file:
      - .env
    environment:
      <<: *shared-budget-environment
      POSTGRES_ENABLED: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DOMEGGOOK_OpenAPI_KEY: ${DOMEGGOOK_OpenAPI_KEY:?DOMEGGOOK_OpenAPI_KEY is required}
      OWNERCLAN_USERNAME: ${OWNERCLAN_USERNAME:?OWNERCLAN_USERNAME is required}
      OWNERCLAN_PASSWORD: ${OWNERCLAN_PASSWORD:?OWNERCLAN_PASSWORD is required}
      COLLECTOR_LIMIT: ${COLLECTOR_LIMIT:-}
      COLLECTOR_DRY_RUN: ${COLLECTOR_DRY_RUN:-false}
      OWNERCLAN_REFRESH_CATEGORIES: ${OWNERCLAN_REFRESH_CATEGORIES:-true}
    volumes:
      - type: bind
        source: .
        target: /app
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    # Starting the development container never calls supplier APIs or changes DB state.
    command: ["python", "-c", "import signal; signal.pause()"]

  operations:
    profiles: [operations]
    build:
      context: .
      dockerfile: Dockerfile.operations
    image: chozy-collector-operations:local
    working_dir: /app
    environment:
      <<: *shared-budget-environment
      # Passed explicitly by the operator; never assembled from production .env.
      REVIEWED_COLLECTOR_DSN: ${REVIEWED_COLLECTOR_DSN:-}
      OWNERCLAN_USERNAME: ${OWNERCLAN_USERNAME:-}
      OWNERCLAN_PASSWORD: ${OWNERCLAN_PASSWORD:-}
      OWNERCLAN_ENV: ${OWNERCLAN_ENV:-production}
    volumes:
      - type: bind
        source: .
        target: /app
        read_only: true
        bind:
          create_host_path: false
      # Keep the existing checkpoint, retry and log paths used by source YAML.
      - type: bind
        source: ./ownerclan_API/data
        target: /app/ownerclan_API/data
        bind:
          create_host_path: false
    # No dependency starts DB/collectors. Default command is an offline plan.
    command: ["plan", "--config", "product_data_collector/operations/example.yaml"]
    stop_grace_period: 3m

volumes:
  postgres_data:
